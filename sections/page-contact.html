<style>
/* ─── CONTACT SECTION ─── */
  .contact-links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 24px;
  }

  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    text-decoration: none;
    transition: color 200ms ease, gap 200ms ease;
  }

  .contact-link:hover {
    color: var(--sea-glass);
    gap: 14px;
  }

  #page-contact {
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  #page-contact::-webkit-scrollbar {
    display: none;
  }

  .contact-page {
    display: flex;
    flex-direction: column;
  }

  .contact-photo {
    width: 100%;
    height: 40vh;
    object-fit: cover;
    object-position: center;
    display: block;
    flex-shrink: 0;
  }

  .contact-bottom {
    display: flex;
    flex-direction: row;
  }

  .contact-left-text {
    width: 50%;
    flex-shrink: 0;
    background: var(--page-bg);
    padding: 52px 56px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border-right: 1px solid var(--border-line);
    transition: background 300ms ease, border-color 300ms ease;
  }

  .contact-eyebrow {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--sea-glass);
    margin-bottom: 4px;
  }

  .contact-heading {
    font-family: 'The Seasons', Georgia, serif;
    font-size: clamp(28px, 3vw, 44px);
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.1;
    margin-bottom: 8px;
    transition: color 300ms ease;
  }

  .contact-left-body {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.6;
    transition: color 300ms ease;
  }

  .contact-links {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-top: 24px;
  }

  .contact-link {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text-primary);
    text-decoration: none;
    transition: color 200ms ease, gap 200ms ease;
  }

  .contact-link:hover {
    color: var(--sea-glass);
    gap: 14px;
  }

  .contact-right {
    width: 50%;
    flex-shrink: 0;
    background: var(--page-bg);
    padding: 52px 56px;
    transition: background 300ms ease;
  }

  .contact-form {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
  }

  .contact-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .contact-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .contact-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-primary);
    transition: color 300ms ease;
  }

  .contact-required {
    color: var(--sea-glass);
    margin-left: 2px;
  }

  .contact-input {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-primary);
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border-line);
    padding: 9px 0;
    outline: none;
    width: 100%;
    transition: border-color 200ms ease, color 300ms ease;
    border-radius: 0;
  }

  .contact-input::placeholder {
    color: var(--text-muted);
    opacity: 0.7;
  }

  .contact-input:focus {
    border-bottom-color: var(--sea-glass);
  }

  .contact-input:hover:not(:focus) {
    border-bottom-color: var(--card-hover-border);
  }

  textarea.contact-input {
    resize: none;
    min-height: 80px;
    line-height: 1.65;
  }

  .contact-consent {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    padding: 4px 0;
    margin-top: 4px;
  }

  .consent-box {
    width: 17px;
    height: 17px;
    min-width: 17px;
    border-radius: 3px;
    border: 1.5px solid var(--border-line);
    background: transparent;
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 250ms ease, background 250ms ease;
    cursor: pointer;
    flex-shrink: 0;
  }

  .contact-consent:hover .consent-box,
  #consent-row:hover .consent-box {
    border-color: var(--sea-glass);
  }

  .consent-box.checked {
    background: var(--sea-glass);
    border-color: var(--sea-glass);
  }

  .consent-box.checked::after {
    content: '';
    display: block;
    width: 9px;
    height: 5px;
    border-left: 1.5px solid var(--deep-cedar);
    border-bottom: 1.5px solid var(--deep-cedar);
    transform: rotate(-45deg) translateY(-1px);
  }

  .consent-text {
    font-size: 11px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.6;
    transition: color 300ms ease;
  }

  .contact-submit {
    margin-top: 8px;
    align-self: flex-start;
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--deep-cedar);
    background: var(--sea-glass);
    border: none;
    padding: 13px 32px;
    cursor: pointer;
    border-radius: 100px;
    transition: background 250ms ease, transform 200ms ease, box-shadow 200ms ease;
  }

  .contact-submit:hover {
    background: #a4c4be;
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(184, 212, 206, 0.25);
  }

  .contact-select {
    appearance: none;
    -webkit-appearance: none;
    cursor: pointer;
    background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l5 5 5-5' stroke='%23888' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    padding-right: 40px;
  }

  .contact-select option {
    background: var(--page-bg);
    color: var(--text-primary);
  }

  @media (max-width: 900px) {
    .contact-bottom {
      flex-direction: column;
    }

    .contact-photo {
      height: 280px;
    }

    .contact-left-text {
      width: 100%;
      padding: 36px 24px;
      border-right: none;
      border-bottom: 1px solid var(--border-line);
    }

    .contact-right {
      width: 100%;
      padding: 36px 24px;
    }

    .contact-row {
      grid-template-columns: 1fr;
    }
  }

  /* Consent checkbox */
  .contact-consent {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    cursor: pointer;
    padding: 4px 0;
  }

  .consent-box {
    width: 18px;
    height: 18px;
    min-width: 18px;
    border-radius: 3px;
    border: 1.5px solid var(--card-border);
    background: var(--card-bg);
    margin-top: 2px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 250ms ease, background 250ms ease;
    cursor: pointer;
    flex-shrink: 0;
  }

  .contact-consent:hover .consent-box,
  #consent-row:hover .consent-box {
    border-color: var(--sea-glass);
  }

  .consent-box.checked {
    background: var(--sea-glass);
    border-color: var(--sea-glass);
  }

  .consent-box.checked::after {
    content: '';
    display: block;
    width: 9px;
    height: 5px;
    border-left: 1.5px solid var(--deep-cedar);
    border-bottom: 1.5px solid var(--deep-cedar);
    transform: rotate(-45deg) translateY(-1px);
  }

  [data-theme="dark"] .consent-box.checked::after {
    border-color: var(--deep-cedar);
  }

  .consent-text {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.6;
    transition: color 300ms ease;
  }
</style>

<div class="page" id="page-contact">
  <div class="contact-page">

    <img src="/images/contact.png" alt="Trail meets tide" class="contact-photo">

    <div class="contact-bottom">

      <!-- LEFT -->
      <div class="contact-left-text">
        <div class="contact-eyebrow">Get in touch</div>
        <h2 class="contact-heading">Let&apos;s talk<br>about your dog.</h2>
        <p class="contact-left-body">For program inquiries and bookings, please send an email to 
          <a class = "contact-link" href="mailto:info@impackfulk9.com">info@impackfulk9.com</a>
          or send a message via this form</p>
        
      </div>

      <!-- RIGHT -->
      <div class="contact-right">
        <form class="contact-form" onsubmit="handleContact(event)">

          <div class="contact-row">
            <div class="contact-field">
              <label class="contact-label">Your Name <span class="contact-required">*</span></label>
              <input class="contact-input" type="text" placeholder="e.g. Sarah Mitchell" required>
            </div>
            <div class="contact-field">
              <label class="contact-label">Your Dog's Name <span class="contact-required">*</span></label>
              <input class="contact-input" type="text" placeholder="e.g. Max" required>
            </div>
          </div>

          <div class="contact-row">
            <div class="contact-field">
              <label class="contact-label">Email <span class="contact-required">*</span></label>
              <input class="contact-input" type="email" placeholder="your@email.com" required>
            </div>
            <div class="contact-field">
              <label class="contact-label">Phone <span class="contact-required">*</span></label>
              <input class="contact-input" type="tel" placeholder="e.g. 604-555-0123" required>
            </div>
          </div>

          <div class="contact-row">
            <div class="contact-field">
              <label class="contact-label">Dog's Breed <span class="contact-required">*</span></label>
              <input class="contact-input" type="text" placeholder="e.g. Belgian Malinois" required>
            </div>
            <div class="contact-field">
              <label class="contact-label">Dog's Age <span class="contact-required">*</span></label>
              <input class="contact-input" type="text" placeholder="e.g. 2 years" required>
            </div>
          </div>

          <div class="contact-field">
            <label class="contact-label">How can we help? <span class="contact-required">*</span></label>
            <select class="contact-input contact-select" required onchange="handleServiceChange(this)">
              <option value="" disabled selected>Select a service...</option>
              <option value="focused-foundations">Focused Foundations</option>
              <option value="mindful-meetups">Mindful Meetups</option>
              <option value="reactivity-remedy">Reactivity Remedy</option>
              <option value="mindful-reset">The Mindful Reset</option>
              <option value="learning-library">The Learning Library (Online)</option>
              <option value="mindful-dog-mentorship">Mindful Dog Trainer Mentorship</option>
              <option value="general">General Inquiry</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="contact-field" id="message-field">
            <label class="contact-label" id="message-label">Tell us more <span class="contact-required">*</span></label>
            <textarea class="contact-input" id="contact-message" placeholder="Tell us what you're working on with your dog..." required></textarea>
          </div>

          <div class="contact-field">
            <label class="contact-label">How did you hear about us? <span class="contact-required">*</span></label>
            <input class="contact-input" type="text" placeholder="e.g. Instagram, word of mouth, Google..." required>
          </div>

          <div class="contact-consent" id="consent-row">
            <div class="consent-box" id="consent-box"></div>
            <input type="checkbox" id="consent-check" required style="display:none">
            <span class="consent-text">By clicking this checkbox, you consent for us to contact you by mail, phone, text, or email.</span>
          </div>

          <button type="submit" class="contact-submit">Send Message</button>

        </form>
      </div>

    </div>
  </div>
</div>
